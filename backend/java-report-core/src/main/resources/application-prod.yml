spring:
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:report-artifacts}

security:
  data-source-credential-key: ${DATA_SOURCE_CREDENTIAL_KEY}
  data-source-credential-key-id: ${DATA_SOURCE_CREDENTIAL_KEY_ID}
  data-source-credential-previous-keys: ${DATA_SOURCE_CREDENTIAL_PREVIOUS_KEYS:}

rocketmq:
  endpoint: ${ROCKETMQ_ENDPOINT}
  document-topic: ${ROCKETMQ_DOCUMENT_TOPIC:document_parse_requested}
  report-generation-topic: ${ROCKETMQ_REPORT_GENERATION_TOPIC:report_generation_outline_confirmed}
  knowledge-item-deleted-topic: ${ROCKETMQ_KNOWLEDGE_ITEM_DELETED_TOPIC:knowledge_item_deleted}
  knowledge-item-index-requested-topic: ${ROCKETMQ_KNOWLEDGE_ITEM_INDEX_REQUESTED_TOPIC:knowledge_item_index_requested}
  producer-group: ${ROCKETMQ_PRODUCER_GROUP:java-report-core-producer}

rule:
  approval:
    supplement-attachment:
      max-size-bytes: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_MAX_SIZE_BYTES:10485760}
      allowed-content-types: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_ALLOWED_CONTENT_TYPES:application/pdf,image/jpeg,image/png,text/csv,text/markdown,text/plain,application/msword,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      external-av:
        enabled: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_EXTERNAL_AV_ENABLED:false}
        host: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_EXTERNAL_AV_HOST:clamav}
        port: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_EXTERNAL_AV_PORT:3310}
        connect-timeout-millis: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_EXTERNAL_AV_CONNECT_TIMEOUT_MILLIS:2000}
        read-timeout-millis: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_EXTERNAL_AV_READ_TIMEOUT_MILLIS:2000}
        max-scan-size-bytes: ${RULE_APPROVAL_SUPPLEMENT_ATTACHMENT_EXTERNAL_AV_MAX_SCAN_SIZE_BYTES:10485760}

knowledge:
  data-source:
    endpoint-allowlist: ${DATA_SOURCE_ENDPOINT_ALLOWLIST}
    profile-catalog-json: ${DATA_SOURCE_PROFILE_CATALOG_JSON:[]}
    scheduler:
      enabled: ${DATA_SOURCE_SYNC_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${DATA_SOURCE_SYNC_SCHEDULER_DELAY_MS:60000}
    credential-reencryption:
      scheduler:
        enabled: ${DATA_SOURCE_CREDENTIAL_REENCRYPTION_SCHEDULER_ENABLED:false}
        fixed-delay-ms: ${DATA_SOURCE_CREDENTIAL_REENCRYPTION_SCHEDULER_DELAY_MS:86400000}
        limit: ${DATA_SOURCE_CREDENTIAL_REENCRYPTION_SCHEDULER_LIMIT:100}
