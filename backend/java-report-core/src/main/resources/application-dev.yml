spring:
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/intelligent_report}
    username: ${DB_USERNAME:report}
    password: ${DB_PASSWORD:report123}
  flyway:
    enabled: true

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}

security:
  data-source-credential-key: ${DATA_SOURCE_CREDENTIAL_KEY:local-dev-data-source-credential-key-change-me}
  data-source-credential-key-id: ${DATA_SOURCE_CREDENTIAL_KEY_ID:local-dev}
  data-source-credential-previous-keys: ${DATA_SOURCE_CREDENTIAL_PREVIOUS_KEYS:}

rocketmq:
  endpoint: ${ROCKETMQ_ENDPOINT:localhost:9876}
  document-topic: ${ROCKETMQ_DOCUMENT_TOPIC:document_parse_requested}
  report-generation-topic: ${ROCKETMQ_REPORT_GENERATION_TOPIC:report_generation_outline_confirmed}
  knowledge-item-deleted-topic: ${ROCKETMQ_KNOWLEDGE_ITEM_DELETED_TOPIC:knowledge_item_deleted}
  knowledge-item-index-requested-topic: ${ROCKETMQ_KNOWLEDGE_ITEM_INDEX_REQUESTED_TOPIC:knowledge_item_index_requested}

knowledge:
  data-source:
    endpoint-allowlist: ${DATA_SOURCE_ENDPOINT_ALLOWLIST:localhost,127.0.0.1,::1,host.docker.internal,postgres,mysql,ir-postgres,intelligent-report-system-mysql-1}
    scheduler:
      enabled: ${DATA_SOURCE_SYNC_SCHEDULER_ENABLED:false}
      fixed-delay-ms: ${DATA_SOURCE_SYNC_SCHEDULER_DELAY_MS:60000}
    credential-reencryption:
      scheduler:
        enabled: ${DATA_SOURCE_CREDENTIAL_REENCRYPTION_SCHEDULER_ENABLED:false}
        fixed-delay-ms: ${DATA_SOURCE_CREDENTIAL_REENCRYPTION_SCHEDULER_DELAY_MS:86400000}
        limit: ${DATA_SOURCE_CREDENTIAL_REENCRYPTION_SCHEDULER_LIMIT:100}

rule:
  webhook-replay:
    worker:
      enabled: ${RULE_WEBHOOK_REPLAY_WORKER_ENABLED:false}
      fixed-delay-ms: ${RULE_WEBHOOK_REPLAY_WORKER_DELAY_MS:2000}
