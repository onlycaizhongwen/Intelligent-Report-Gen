spring:
  application:
    name: java-report-core
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/intelligent_report}
    username: ${DB_USERNAME:report}
    password: ${DB_PASSWORD:report123}
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-32-bytes-minimum}
    access-token-ttl-seconds: 7200
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket: ${MINIO_BUCKET:report-artifacts}
rocketmq:
  endpoint: ${ROCKETMQ_ENDPOINT:localhost:9876}
  document-topic: ${ROCKETMQ_DOCUMENT_TOPIC:document_parse_requested}
  report-generation-topic: ${ROCKETMQ_REPORT_GENERATION_TOPIC:report_generation_outline_confirmed}
  knowledge-item-deleted-topic: ${ROCKETMQ_KNOWLEDGE_ITEM_DELETED_TOPIC:knowledge_item_deleted}
  knowledge-item-index-requested-topic: ${ROCKETMQ_KNOWLEDGE_ITEM_INDEX_REQUESTED_TOPIC:knowledge_item_index_requested}
  producer-group: ${ROCKETMQ_PRODUCER_GROUP:java-report-core-producer}
