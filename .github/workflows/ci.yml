name: intelligent-report-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  openspec-contract:
    name: OpenSpec and contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenSpec baseline exists
        run: |
          test -d openspec/specs
          test -f docs/skill-chain/api_contract.md
          grep -R "SHALL" openspec/specs
      - name: Check forbidden scope drift
        run: |
          ! grep -R "RabbitMQ\|Kafka\|Go Gin\|Java 21\|React" backend frontend config monitoring docker-compose.yml Dockerfile.java Dockerfile.python Dockerfile.frontend --exclude-dir=node_modules --exclude-dir=dist

  java:
    name: Java 17 Spring Boot checks
    runs-on: ubuntu-latest
    needs: openspec-contract
    defaults:
      run:
        working-directory: backend/java-report-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Test Java service
        run: ../../mvnw test

  python:
    name: Python AI checks
    runs-on: ubuntu-latest
    needs: openspec-contract
    env:
      JWT_SECRET: ci-test-secret-change-in-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install and test Python AI service
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/python-ai-service pytest pytest-asyncio
          pytest tests/unit/python -q

  frontend:
    name: Vue 3 TypeScript checks
    runs-on: ubuntu-latest
    needs: openspec-contract
    defaults:
      run:
        working-directory: frontend/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/web-console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [java, python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Java image
        run: docker build -f Dockerfile.java .
      - name: Build Python image
        run: docker build -f Dockerfile.python .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend .

  e2e:
    name: Playwright E2E smoke
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/web-console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke
        run: npm run e2e
