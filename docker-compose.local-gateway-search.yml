name: intelligent-report-local-gateway-search

services:
  ir-opensearch:
    image: docker.m.daocloud.io/opensearchproject/opensearch:2.18.0
    container_name: ir-opensearch
    environment:
      cluster.name: intelligent-report-local
      node.name: ir-opensearch
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ir_opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    networks:
      report-infra:
        aliases:
          - opensearch

  ir-higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.0.6
    container_name: ir-higress
    environment:
      MODE: full
      GATEWAY_HTTP_PORT: "8080"
      GATEWAY_HTTPS_PORT: "8443"
      CONSOLE_PORT: "8001"
      ENABLE_CONSOLE_ROUTE: "0"
      USE_PLUGIN_SERVER: "on"
    volumes:
      - ./config/higress/local-data:/data
    ports:
      - "18000:8080"
      - "18443:8443"
      - "18001:8001"
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    networks:
      report-infra:
        aliases:
          - higress

volumes:
  ir_opensearch_data:

networks:
  report-infra:
    external: true
    name: intelligent-report-infra_default
