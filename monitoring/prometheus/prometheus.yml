global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: java-report-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["java-report-core:8080"]
        labels:
          openspec: "REQ-REPORT-001,REQ-AUTH-001,REQ-AUDIT-001"

  - job_name: python-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["python-ai-service:8000"]
        labels:
          openspec: "REQ-AI-001,REQ-KB-002,REQ-REPORT-003"

  - job_name: higress
    metrics_path: /metrics
    static_configs:
      - targets: ["higress:15020"]
        labels:
          openspec: "REQ-AI-001,REQ-AUTH-001"

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          openspec: "infrastructure"

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          openspec: "infrastructure"

  - job_name: rocketmq
    static_configs:
      - targets: ["rocketmq-exporter:5557"]
        labels:
          openspec: "REQ-REPORT-001,REQ-KB-002,REQ-REPORT-004"

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          openspec: "REQ-KB-002,REQ-REPORT-004"

  - job_name: milvus
    metrics_path: /metrics
    static_configs:
      - targets: ["milvus:9091"]
        labels:
          openspec: "REQ-AI-001,REQ-REPORT-003"

  - job_name: opensearch
    static_configs:
      - targets: ["opensearch-exporter:9114"]
        labels:
          openspec: "REQ-KB-001,REQ-KB-003"
